name: CI/CD & Production Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  CONTAINER_NAME: new-life-app

jobs:
  verify-and-deploy:
    name: Typecheck, Build, Push to GHCR & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Build Nuxt production bundle
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name to lowercase
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy container to VPS (auto-create DB in my_postgres & replace new-life-app)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ steps.meta.outputs.image }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            PG_CONTAINER="my_postgres"
            DB_NAME="personal_os"

            PG_USER=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$PG_CONTAINER" | grep '^POSTGRES_USER=' | cut -d'=' -f2- || true)
            PG_USER="${PG_USER:-postgres}"

            PG_PASS=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$PG_CONTAINER" | grep '^POSTGRES_PASSWORD=' | cut -d'=' -f2- || true)
            PG_PASS="${PG_PASS:-postgres}"

            docker exec -e PGPASSWORD="$PG_PASS" "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" | grep -q 1 || \
              docker exec -e PGPASSWORD="$PG_PASS" "$PG_CONTAINER" psql -U "$PG_USER" -d postgres -c "CREATE DATABASE $DB_NAME;"

            PG_NET=$(docker inspect --format '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' "$PG_CONTAINER" | head -n 1 | tr -d '[:space:]')

            if [ -n "$PG_NET" ] && [ "$PG_NET" != "bridge" ]; then
              NETWORK_ARG="--network $PG_NET"
              DB_HOST="$PG_CONTAINER"
            else
              NETWORK_ARG="--link $PG_CONTAINER:postgres_host"
              DB_HOST="postgres_host"
            fi

            FINAL_DB_URL="postgresql://${PG_USER}:${PG_PASS}@${DB_HOST}:5432/${DB_NAME}"

            docker pull "$IMAGE_TAG"
            docker stop new-life-app || true
            docker rm new-life-app || true

            docker run -d \
              --name new-life-app \
              --restart unless-stopped \
              $NETWORK_ARG \
              -p 127.0.0.1:3090:3000 \
              -e NODE_ENV=production \
              -e NITRO_HOST=0.0.0.0 \
              -e NITRO_PORT=3000 \
              -e TZ=Asia/Tehran \
              -e DATABASE_URL="$FINAL_DB_URL" \
              "$IMAGE_TAG"

            docker image prune -f
