name: CI/CD & Production Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  IMAGE_NAME: ghcr.io/parsastudio/personal-os:latest
  CONTAINER_NAME: new-life-app

jobs:
  verify-and-deploy:
    name: Typecheck, Build, Push to GHCR & Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Build Nuxt production bundle
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy container to VPS (replace new-life-app on 127.0.0.1:3090)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        env:
          SECRET_DB_URL: ${{ secrets.DATABASE_URL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: SECRET_DB_URL,GHCR_TOKEN,GHCR_USER
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            EXISTING_DB_URL=""
            EXISTING_NETWORK=""
            if docker inspect new-life-app >/dev/null 2>&1; then
              EXISTING_DB_URL=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' new-life-app | grep '^DATABASE_URL=' | cut -d'=' -f2- || true)
              EXISTING_NETWORK=$(docker inspect --format '{{.HostConfig.NetworkMode}}' new-life-app || true)
            fi

            FINAL_DB_URL="${SECRET_DB_URL:-$EXISTING_DB_URL}"
            NETWORK_ARG=""
            if [ -n "$EXISTING_NETWORK" ] && [ "$EXISTING_NETWORK" != "default" ]; then
              NETWORK_ARG="--network $EXISTING_NETWORK"
            else
              NETWORK_ARG="--add-host=host.docker.internal:host-gateway"
            fi

            docker pull ghcr.io/parsastudio/personal-os:latest
            docker stop new-life-app || true
            docker rm new-life-app || true

            docker run -d \
              --name new-life-app \
              --restart unless-stopped \
              $NETWORK_ARG \
              -p 127.0.0.1:3090:3000 \
              -e NODE_ENV=production \
              -e NITRO_HOST=0.0.0.0 \
              -e NITRO_PORT=3000 \
              -e TZ=Asia/Tehran \
              -e DATABASE_URL="$FINAL_DB_URL" \
              ghcr.io/parsastudio/personal-os:latest

            docker image prune -f
